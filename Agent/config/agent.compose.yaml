# Конфигурация для запуска в docker compose.
# Отличия от примера: адрес координатора — имя сервиса, имя узла и число
# потоков приходят из окружения, каталог данных — том контейнера.

agent:
  name: worker
  threads: 4
  storage_path: /data/videos
  state_dir: /data/videos/.agent
  min_free_space_gb: 1
  log_level: INFO
  log_json: true

coordinator:
  base_url: http://coordinator:8000
  token: ${AGENT_TOKEN}
  heartbeat_interval: 5
  lease_ttl: 60
  poll_interval: 2

limits:
  rps: 10
  max_connections: 32
  # Потолок не ниже максимального числа потоков узла (worker-02 = 16).
  check_concurrency: 16
  download_concurrency: 2

retry:
  max_retries: 4
  base_delay: 1.0
  max_delay: 30
  jitter: 0.3

site_adapter:
  page_url_template: "https://kinescope.io/{id}"
  request_timeout_seconds: 20
  user_agent: "lab-agent/1.0 (educational project)"
  # Kinescope отвечает 308 на числовой адрес и ведёт на канонический.
  follow_redirects: true
  allowed_redirect_hosts:
    - "kinescope.io"
  missing_markers:
    - "страница не найдена"
    - "not found"
  download:
    policy: public_only
    prefer: direct           # direct — mp4 со звуком, hls — сегменты без звука
    max_file_size_bytes: 2147483648
