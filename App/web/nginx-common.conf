# Общая часть конфигурации с TLS и без него: подключается через include.
root /usr/share/nginx/html;
index index.html;

# Результаты пачками: блок до 10 000 элементов с метаданными.
client_max_body_size 32m;

# Адрес из переменной определяется при запросе, а не один раз при старте nginx:
# пересозданный контейнер api получает новый IP.
resolver 127.0.0.11 valid=10s;
set $api http://api:8000;

# Защита от XSS и встраивания страницы (ТЗ, п. 14). Встроенные стили нужны прогресс-бару
# и терминалу, встроенные скрипты запрещены. wss: — терминал контейнера.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # Терминал контейнера идёт по WebSocket, обычным запросам эти заголовки не мешают.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Обновление образа ждёт регистрации агента, терминал живёт долго.
    proxy_read_timeout 300s;
}

location / {
    try_files $uri $uri/ /index.html;
}
