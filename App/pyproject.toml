[project]
name = "coordinator"
version = "0.1.0"
description = "Платформа: координатор, API, хранилище состояния и веб-интерфейс"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "websockets>=14",
    "asyncssh>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "stub"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["stub"]
markers = [
    "integration: требует запущенных db и redis",
]
