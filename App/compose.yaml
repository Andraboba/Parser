# Стенд одной командой: scripts/init-env.sh && docker compose up -d --build
# Интерфейс и API: https://localhost:8443, сертификат подписан CA из deploy/tls/ca.crt.
#
# Рабочие серверы — контейнеры с SSH вместо арендованных машин (worker-01..03). Координатор сам
# входит на них по SSH, ставит и запускает агентов: как на настоящих серверах, только бесплатно.
name: coord

x-app-env: &app-env
  COORD_DATABASE_URL: postgresql+psycopg://coord:coord@db:5432/coord
  COORD_REDIS_URL: redis://redis:6379/0
  # На стенде с заглушками лимит высокий, для настоящего сайта задайте его в .env (ТЗ: 20).
  COORD_GLOBAL_RPS_LIMIT: ${COORD_GLOBAL_RPS_LIMIT:-3000}
  COORD_RUNNER_URL: http://runner:9000
  COORD_COOKIE_SECURE: "true"
  COORD_AGENT_KIND: ${COORD_AGENT_KIND:-real}
  # Управляемый тестовый сайт стенда. Настоящий внешний сайт задаётся только явно.
  COORD_AGENT_SITE_TEMPLATE: ${COORD_AGENT_SITE_TEMPLATE:-http://site:8081/page/{id}}
  # Внешний адрес стенда для агентов на настоящих машинах (серверы, добавленные по IP), например
  # https://203.0.113.5:8443. Контейнеры worker-* стенда ходят внутри сети, на https://web.
  COORD_AGENT_PUBLIC_URL: ${COORD_AGENT_PUBLIC_URL:-}
  # Имена серверов, на которые можно входить по SSH. IP-адреса разрешены всегда (только админу).
  COORD_SSH_ALLOWED_HOSTS: ${COORD_SSH_ALLOWED_HOSTS:-worker-*,lab-*}

x-server: &server
  build: { context: deploy/ssh-server }
  image: coord/ssh-server:dev
  restart: unless-stopped
  # Агент здесь обычный процесс: кто-то должен прибирать завершившиеся процессы.
  init: true
  secrets: [ssh_client_key_pub]
  depends_on:
    tls-init: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "pgrep", "sshd"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coord
      POSTGRES_PASSWORD: coord
      POSTGRES_DB: coord
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coord -d coord"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  migrate:
    build: { context: ., dockerfile: deploy/Dockerfile, target: runtime }
    image: coord/platform:dev
    command: ["sh", "-c", "alembic upgrade head && python -m coordinator.bootstrap"]
    environment:
      <<: *app-env
      COORD_SEED_SERVERS_FILE: /etc/coordinator/servers.json
    secrets: [coord_admin_password]
    volumes: ["./deploy/servers.json:/etc/coordinator/servers.json:ro"]
    depends_on:
      db: { condition: service_healthy }

  api:
    image: coord/platform:dev
    # Процессов и CPU больше — запас по числу агентов, см. docs/load-report.md.
    command:
      - uvicorn
      - coordinator.api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-access-log
      - --workers=${COORD_API_WORKERS:-1}
    environment: *app-env
    secrets: [coord_runner_token]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "${COORD_API_CPUS:-1.0}", memory: 1g }

  dispatcher:
    image: coord/platform:dev
    command: ["python", "-m", "coordinator.dispatcher.main"]
    environment: *app-env
    secrets: [coord_runner_token]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # Единственный сервис с доступом к Docker API и закрытому ключу SSH. Узкий набор операций,
  # отдельный токен, порт наружу не публикуется. В api и dispatcher сокета и ключа нет.
  runner:
    image: coord/platform:dev
    command: ["uvicorn", "coordinator.runner.main:app", "--host", "0.0.0.0", "--port", "9000"]
    # Сокет Docker доступен только root.
    user: "0"
    environment: *app-env
    secrets: [coord_runner_token, ssh_client_key]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Запомненные ключи серверов.
      - runner-state:/var/lib/runner
      # Что ставить на серверы: настоящий агент и заглушка.
      - ../Agent/agent:/bundles/real/agent:ro
      - ./deploy/real-agent/agent.yaml:/bundles/real/agent.yaml:ro
      - ./deploy/real-agent/run.sh:/bundles/real/run.sh:ro
      - ./stub:/bundles/stub:ro
      # Открытый сертификат CA: его получают агенты на настоящих машинах.
      - ./deploy/tls/ca.crt:/bundles/ca.crt:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  web:
    build: { context: web }
    image: coord/web:dev
    ports: ["${COORD_HTTPS_PORT:-8443}:443", "${COORD_HTTP_PORT:-8080}:80"]
    volumes: ["./deploy/tls:/etc/nginx/tls:ro"]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # Кладёт только открытый сертификат CA в общий том: его монтируют все серверы,
  # в том числе созданные runner-ом, у которых нет доступа к файлам хоста.
  tls-init:
    image: coord/platform:dev
    user: "0"
    command: ["sh", "-c", "cp /tls-src/ca.crt /certs/ca.crt && chmod 644 /certs/ca.crt"]
    volumes:
      - ./deploy/tls:/tls-src:ro
      - tls-ca:/certs

  # Управляемый тестовый сайт из Agent/tests: страницы 200, 403, 404, 429, 500 и файлы.
  site:
    image: python:3.13-slim
    command: ["python", "-u", "/site/site.py"]
    environment:
      PYTHONPATH: /support
    volumes:
      - ./deploy/real-agent:/site:ro
      - ../Agent/tests/support:/support:ro
    restart: unless-stopped

  # Рабочие серверы с разной мощностью (таблица 2.1 плана). Имена и параметры входа
  # в deploy/servers.json. Адреса в сети стенда совпадают с именами сервисов.
  worker-01:
    <<: *server
    hostname: worker-01
    volumes: ["videos-01:/data/videos", "ssh-keys-01:/etc/ssh/keys", "tls-ca:/certs:ro"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m, pids: 256 }

  worker-02:
    <<: *server
    hostname: worker-02
    volumes: ["videos-02:/data/videos", "ssh-keys-02:/etc/ssh/keys", "tls-ca:/certs:ro"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g, pids: 256 }

  worker-03:
    <<: *server
    hostname: worker-03
    volumes: ["videos-03:/data/videos", "ssh-keys-03:/etc/ssh/keys", "tls-ca:/certs:ro"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m, pids: 256 }

  # Метрики и дашборд: docker compose --profile monitoring up -d
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/coord_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets: [coord_admin_password]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # Линтер и тесты: docker compose --profile ci run --rm tests
  tests:
    profiles: [ci]
    build: { context: ., dockerfile: deploy/Dockerfile, target: dev }
    image: coord/platform:dev-tests
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["pytest", "-q"]

secrets:
  coord_admin_password: { file: ./secrets/coord_admin_password }
  coord_runner_token: { file: ./secrets/coord_runner_token }
  ssh_client_key: { file: ./secrets/ssh_client_key }
  ssh_client_key_pub: { file: ./secrets/ssh_client_key_pub }

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  videos-01:
  videos-02:
  videos-03:
  ssh-keys-01:
  ssh-keys-02:
  ssh-keys-03:
  runner-state:
  tls-ca:
    name: coord-tls-ca
