name: platform-ci

on:
  push:
    paths: ["App/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["App/**", ".github/workflows/platform-ci.yml"]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - name: Lint, migrations, tests
        run: bash scripts/ci.sh
